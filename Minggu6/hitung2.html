<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Nilai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2 class="mt-4 mb-3">Hitung Nilai Mahasiswa</h2>

        <div class="mb-3">
            <label for="nama" class="form-label">Nama Mahasiswa</label>
            <input class="form-control" type="text" id="nama" placeholder="Masukkan nama mahasiswa">
        </div>

        <div class="mb-3">
            <label for="tugas" class="form-label">Nilai Tugas</label>
            <input class="form-control" type="number" id="tugas" placeholder="Masukkan nilai tugas">
        </div>

        <div class="mb-3">
            <label for="uts" class="form-label">Nilai UTS</label>
            <input class="form-control" type="number" id="uts" placeholder="Masukkan nilai UTS">
        </div>

        <div class="mb-3">
            <label for="uas" class="form-label">Nilai UAS</label>
            <input class="form-control" type="number" id="uas" placeholder="Masukkan nilai UAS">
        </div>

        <button type="button" class="btn btn-primary w-100 mt-4" onclick="hitungNilai()">Hitung Nilai</button>

        <div id="hasil"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/hitung_nilai.js"></script>
</body>
</html>
