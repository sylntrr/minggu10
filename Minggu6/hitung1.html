<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Nilai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2 class="mt-4 mb-3">Hitung Nilai Mahasiswa</h2>

        <div class="mb-3">
            <label for="nama" class="form-label">Nama Mahasiswa</label>
            <input class="form-control" type="text" id="nama" placeholder="Masukkan nama mahasiswa">
        </div>

        <div class="mb-3">
            <label for="tugas" class="form-label">Nilai Tugas</label>
            <input class="form-control" type="number" id="tugas" placeholder="Masukkan nilai tugas">
        </div>

        <div class="mb-3">
            <label for="uts" class="form-label">Nilai UTS</label>
            <input class="form-control" type="number" id="uts" placeholder="Masukkan nilai UTS">
        </div>

        <div class="mb-3">
            <label for="uas" class="form-label">Nilai UAS</label>
            <input class="form-control" type="number" id="uas" placeholder="Masukkan nilai UAS">
        </div>

        <button type="button" class="btn btn-primary w-100 mt-4" onclick="hitungNilai()">Hitung Nilai</button>

        <div id="hasil"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function hitungNilai() {
            const xnama  = document.getElementById("nama").value.trim();
            const ytugas = parseFloat(document.getElementById("tugas").value);
            const yuts   = parseFloat(document.getElementById("uts").value);
            const yuas   = parseFloat(document.getElementById("uas").value);

            if (xnama === "" || isNaN(ytugas) || isNaN(yuts) || isNaN(yuas)) {
                alert("Semua kolom harus diisi!");
                return;
            }

            if (
                ytugas < 0 || ytugas > 100 ||
                yuts < 0 || yuts > 100 ||
                yuas < 0 || yuas > 100
            ) {
                alert("Nilai harus antara 0 sampai 100!");
                return;
            }

            const nilaiAkhir = (ytugas * 0.30) + (yuts * 0.30) + (yuas * 0.40);

            let nilaiHuruf;

            if (nilaiAkhir >= 85) {
                nilaiHuruf = "A";
            } else if (nilaiAkhir >= 75) {
                nilaiHuruf = "B";
            } else if (nilaiAkhir >= 65) {
                nilaiHuruf = "C";
            } else if (nilaiAkhir >= 50) {
                nilaiHuruf = "D";
            } else {
                nilaiHuruf = "E";
            }

            let status;

            if (nilaiAkhir >= 60) {
                status = "Lulus";
            } else {
                status = "Tidak Lulus";
            }

            const warna = (status === "Lulus") ? "alert-success" : "alert-danger";

            const hasil = document.getElementById("hasil");

            hasil.innerHTML = `
            <div class="card mt-4">
                <div class="card-body">
                    <h3 class="h5 mb-3">Hasil Perhitungan</h3>
                    Nama : ${xnama}<br>
                    Nilai Tugas : ${ytugas}<br>
                    Nilai UTS : ${yuts}<br>
                    Nilai UAS : ${yuas}<br>
                    <hr>
                    Nilai Akhir : <b>${nilaiAkhir.toFixed(2)}</b><br>
                    Nilai Huruf : <b>${nilaiHuruf}</b><br>
                    Status : <b>${status}</b>
                </div>
            </div>
            `;
        }
    </script>
</body>
</html>
